[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.7"
hilt = "2.59.2"
composeBom = "2025.10.00"
activityCompose = "1.11.0"
coreKtx = "1.17.0"
navigationCompose = "2.9.5"
hiltNavigationCompose = "1.2.0"
lifecycle = "2.9.4"
room = "2.7.2"
datastore = "1.1.7"
coroutines = "1.10.2"
