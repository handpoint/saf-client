handpointSdk = "7.1014.1"
junit = "4.13.2"
turbine = "1.2.1"
mockk = "1.13.12"
robolectric = "4.16"

[libraries]
handpoint-sdk = { module = "com.handpoint.api:sdk", version.ref = "handpointSdk" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
